<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="WiltonLab banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="50%" stop-color="#111a35"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="rackGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2540"/>
      <stop offset="100%" stop-color="#0e1530"/>
    </linearGradient>
    <linearGradient id="unitGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26314f"/>
      <stop offset="100%" stop-color="#1a2238"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2540" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Decorative network lines -->
  <g opacity="0.25" stroke="#4a9eff" stroke-width="1" fill="none">
    <path d="M 0 80 Q 300 60 600 100 T 1200 80"/>
    <path d="M 0 240 Q 400 260 800 220 T 1200 250"/>
    <path d="M 0 160 L 1200 160" stroke-dasharray="4 8" opacity="0.4"/>
  </g>

  <!-- Animated data packets -->
  <circle r="3" fill="#4a9eff" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M 0 80 Q 300 60 600 100 T 1200 80"/>
  </circle>
  <circle r="3" fill="#7af0a8" filter="url(#glow)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M 0 240 Q 400 260 800 220 T 1200 250"/>
  </circle>
  <circle r="2" fill="#f0c674" filter="url(#glow)" opacity="0.8">
    <animateMotion dur="5s" repeatCount="indefinite" path="M 1200 80 Q 900 60 600 100 T 0 80"/>
  </circle>

  <!-- Rack (left side) -->
  <g transform="translate(60, 50)">
    <!-- Rack frame -->
    <rect x="0" y="0" width="160" height="220" rx="4" fill="url(#rackGrad)" stroke="#2a3656" stroke-width="2"/>
    <rect x="6" y="6" width="148" height="208" rx="2" fill="#0a0f24"/>

    <!-- Rack units -->
    <g transform="translate(12, 14)">
      <!-- UDM Pro Max -->
      <rect x="0" y="0" width="136" height="18" rx="2" fill="url(#unitGrad)" stroke="#3a4670" stroke-width="0.5"/>
      <circle cx="8" cy="9" r="2" fill="#4ade80" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="16" cy="9" r="2" fill="#4ade80" filter="url(#glow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <rect x="100" y="6" width="6" height="6" fill="#1a2238"/>
      <rect x="110" y="6" width="6" height="6" fill="#1a2238"/>
      <rect x="120" y="6" width="6" height="6" fill="#1a2238"/>

      <!-- Switch Pro Max -->
      <rect x="0" y="22" width="136" height="18" rx="2" fill="url(#unitGrad)" stroke="#3a4670" stroke-width="0.5"/>
      <g transform="translate(8, 28)">
        <rect width="4" height="6" fill="#4a9eff"><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/></rect>
        <rect x="6" width="4" height="6" fill="#4a9eff"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/></rect>
        <rect x="12" width="4" height="6" fill="#4a9eff"><animate attributeName="opacity" values="1;0.5;1" dur="2.1s" repeatCount="indefinite"/></rect>
        <rect x="18" width="4" height="6" fill="#4a9eff"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/></rect>
        <rect x="24" width="4" height="6" fill="#4a9eff" opacity="0.5"/>
        <rect x="30" width="4" height="6" fill="#4a9eff"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></rect>
        <rect x="36" width="4" height="6" fill="#4a9eff" opacity="0.4"/>
        <rect x="42" width="4" height="6" fill="#4a9eff"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.3s" repeatCount="indefinite"/></rect>
        <rect x="48" width="4" height="6" fill="#4a9eff" opacity="0.6"/>
        <rect x="54" width="4" height="6" fill="#4a9eff"><animate attributeName="opacity" values="1;0.4;1" dur="1.4s" repeatCount="indefinite"/></rect>
      </g>

      <!-- Cisco Switch -->
      <rect x="0" y="44" width="136" height="18" rx="2" fill="url(#unitGrad)" stroke="#3a4670" stroke-width="0.5"/>
      <circle cx="8" cy="53" r="2" fill="#f0c674" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
      </circle>
      <rect x="20" y="50" width="100" height="6" fill="#1a2238"/>

      <!-- Cisco Router -->
      <rect x="0" y="66" width="136" height="18" rx="2" fill="url(#unitGrad)" stroke="#3a4670" stroke-width="0.5"/>
      <circle cx="8" cy="75" r="2" fill="#f0c674" opacity="0.6"/>
      <circle cx="16" cy="75" r="2" fill="#f0c674"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/></circle>

      <!-- Empty space -->
      <rect x="0" y="88" width="136" height="40" rx="2" fill="#0a0f24" stroke="#1a2540" stroke-width="0.5" stroke-dasharray="2 2"/>

      <!-- 4RU Server (planned) -->
      <rect x="0" y="132" width="136" height="36" rx="2" fill="url(#unitGrad)" stroke="#3a4670" stroke-width="0.5" opacity="0.6"/>
      <text x="68" y="153" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#6b7a99">[4RU PLANNED]</text>

      <!-- HP Mini 1 -->
      <rect x="0" y="172" width="64" height="14" rx="2" fill="url(#unitGrad)" stroke="#3a4670" stroke-width="0.5"/>
      <circle cx="6" cy="179" r="1.5" fill="#4ade80"><animate attributeName="opacity" values="1;0.5;1" dur="1.7s" repeatCount="indefinite"/></circle>

      <!-- HP Mini 2 -->
      <rect x="72" y="172" width="64" height="14" rx="2" fill="url(#unitGrad)" stroke="#3a4670" stroke-width="0.5"/>
      <circle cx="78" cy="179" r="1.5" fill="#4ade80"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.9s" repeatCount="indefinite"/></circle>

      <!-- UPS -->
      <rect x="0" y="190" width="136" height="14" rx="2" fill="#2a1f1a" stroke="#4a3326" stroke-width="0.5"/>
      <circle cx="8" cy="197" r="2" fill="#ef4444" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <text x="120" y="200" text-anchor="end" font-family="ui-monospace, monospace" font-size="7" fill="#9ca3af">1500W</text>
    </g>
  </g>

  <!-- Title block -->
  <g transform="translate(280, 110)">
    <text x="0" y="0" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="56" font-weight="700" fill="#e8ecf5" letter-spacing="-1">
      WiltonLab
    </text>
    <text x="0" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#9ca3af" letter-spacing="1">
      UniFi · Cisco · Proxmox · Docker
    </text>
    <g transform="translate(0, 70)">
      <rect x="0" y="0" width="10" height="10" fill="#4ade80">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="18" y="9" font-family="ui-monospace, monospace" font-size="12" fill="#cbd5e1">
        22RU · 2 production hosts · lab build in progress
      </text>
    </g>
  </g>

  <!-- Right-side decorative terminal -->
  <g transform="translate(820, 60)">
    <rect x="0" y="0" width="320" height="200" rx="6" fill="#0a0f24" stroke="#2a3656" stroke-width="1.5" opacity="0.9"/>
    <rect x="0" y="0" width="320" height="22" rx="6" fill="#1a2540"/>
    <rect x="0" y="16" width="320" height="6" fill="#1a2540"/>
    <circle cx="12" cy="11" r="4" fill="#ef4444"/>
    <circle cx="26" cy="11" r="4" fill="#f0c674"/>
    <circle cx="40" cy="11" r="4" fill="#4ade80"/>
    <text x="160" y="15" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#6b7a99">wil-ser01 — ssh</text>

    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#7af0a8">
      <text x="14" y="44">$ docker ps --format "{{.Names}}"</text>
      <text x="14" y="62" fill="#cbd5e1">pihole</text>
      <text x="14" y="78" fill="#cbd5e1">homebridge</text>
      <text x="14" y="104">$ uptime</text>
      <text x="14" y="122" fill="#cbd5e1"> 11:42:07 up 47 days,  3:18</text>
      <text x="14" y="148">$ ping -c 1 1.1.1.1</text>
      <text x="14" y="166" fill="#cbd5e1">64 bytes from 1.1.1.1: time=4.2 ms</text>
      <text x="14" y="186">$ <tspan fill="#4ade80">_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>
    </g>
  </g>
</svg>
